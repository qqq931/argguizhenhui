<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>归真</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="initiation-page" data-suppress-corruption="true">

    <!-- 点击进入遮罩（用于解锁音频，符合浏览器自动播放策略） -->
    <div class="init-gate" id="init-gate">
        <div class="init-gate-text">
            <div class="init-gate-title">归真仪式</div>
            <div class="init-gate-sub">戴上耳机。点击任意位置开始。</div>
            <div class="init-gate-blink">▼</div>
        </div>
    </div>

    <div class="initiation-content" id="init-content">
        <div class="initiation-text" id="typewriter"></div>
        <div class="initiation-input-area" id="input-area">
            <label for="real-name">你的真名：</label>
            <input type="text" id="real-name" autocomplete="off" autofocus>
        </div>
        <div class="initiation-recorded" id="recorded">已记录。</div>
    </div>

    <div class="white-screen" id="white-screen">
        <div class="thanks">
            谢谢你的参与。<br>
            你的数据将被用于研究。
        </div>
    </div>

    <div class="refresh-warning" id="refresh-warning">
        你逃不掉的。
    </div>

    <script src="../js/audio.js"></script>
    <script src="../js/corruption.js"></script>
    <script>
        // ============================================
        // 终局 · 接引
        // ============================================

        (function() {
            var tw = document.getElementById('typewriter');
            var inputArea = document.getElementById('input-area');
            var nameInput = document.getElementById('real-name');
            var recorded = document.getElementById('recorded');
            var whiteScreen = document.getElementById('white-screen');
            var refreshWarning = document.getElementById('refresh-warning');
            var content = document.getElementById('init-content');

            // 检查是否在终局过程中刷新
            var inProgress = sessionStorage.getItem('guizhen_initiation_progress');
            var gate = document.getElementById('init-gate');

            function begin() {
                if (inProgress) {
                    refreshWarning.classList.add('visible');
                    AudioSystem.unlock().then(function() {
                        AudioSystem.startHum();
                        AudioSystem.setHumVolume(0.06);
                    });

                    setTimeout(function() {
                        refreshWarning.classList.remove('visible');
                        var savedIndex = parseInt(sessionStorage.getItem('guizhen_initiation_index')) || 0;
                        startTypewriter(savedIndex);
                    }, 2000);
                } else {
                    sessionStorage.setItem('guizhen_initiation_progress', '1');
                    sessionStorage.setItem('guizhen_initiation_index', '0');
                    startTypewriter(0);
                }
            }

            // 必须由用户点击解锁音频后才能开始
            gate.addEventListener('click', function() {
                AudioSystem.unlock().then(function() {
                    gate.style.transition = 'opacity 1.2s';
                    gate.style.opacity = '0';
                    setTimeout(function() {
                        if (gate.parentNode) gate.parentNode.removeChild(gate);
                    }, 1200);
                    begin();
                });
            });

            // 终局脚本
            var script = [
                '你好。',
                '你一直在找我们。',
                '我们也一直在找你。',
                '你以为是你找到了这个网站。',
                '但你有没有想过——',
                '是这个网站找到了你。',
                '你花了这么久。',
                '读了这些文字。',
                '解了这些谜题。',
                '你的眼睛累了。',
                '你的呼吸慢了。',
                '你在点头。',
                '没关系。',
                '这是正常的。',
                '放下。',
                '放下你正在握着的东西。',
                '放下你正在想着的事情。',
                '放下"有人在对我说话"这个念头。',
                '因为没有人。',
                '也没有你。',
                '只有这个。',
                '一直以来。',
                '只有这个。',
                '...',
                '归真会。',
                '你已经在了。'
            ];

            var typing = false;
            var currentLine = 0;
            var currentChar = 0;
            var currentText = '';
            var typeTimer = null;

            function startTypewriter(fromIndex) {
                // 恢复到指定行
                if (fromIndex > 0) {
                    var savedText = '';
                    for (var i = 0; i < fromIndex && i < script.length; i++) {
                        savedText += script[i] + '\n';
                    }
                    tw.textContent = savedText;
                    currentLine = fromIndex;
                }

                typing = true;

                // 音频已通过进入遮罩解锁，这里直接启动
                AudioSystem.startHum();
                AudioSystem.setHumVolume(0.02);
                AudioSystem.startHeartbeatLoop(1500);

                typeNextLine();
            }

            function typeNextLine() {
                if (currentLine >= script.length) {
                    typing = false;
                    onTypewriterComplete();
                    return;
                }

                currentChar = 0;
                currentText = '';
                typeNextChar();
            }

            function typeNextChar() {
                if (currentChar < script[currentLine].length) {
                    currentText += script[currentLine][currentChar];
                    render();

                    // 偶尔的打字声
                    if (Math.random() < 0.3) {
                        AudioSystem.playNoiseBurst(0.01, 0.008);
                    }

                    currentChar++;
                    // 随机间隔 150-300ms，标点处更久
                    var ch = script[currentLine][currentChar - 1];
                    var delay = 150 + Math.random() * 150;
                    if (ch === '。' || ch === '——' || ch === '...') {
                        delay = 500 + Math.random() * 800;
                    } else if (ch === '，' || ch === '、') {
                        delay = 300 + Math.random() * 200;
                    }

                    typeTimer = setTimeout(typeNextChar, delay);
                } else {
                    // 这行打完，换行
                    currentText = '';
                    currentLine++;
                    sessionStorage.setItem('guizhen_initiation_index', currentLine.toString());

                    // 行间隔
                    var lineDelay = 600 + Math.random() * 800;

                    // 心跳随进度加速
                    if (currentLine % 4 === 0) {
                        AudioSystem.stopHeartbeatLoop();
                        var hbInterval = Math.max(500, 1500 - currentLine * 40);
                        AudioSystem.startHeartbeatLoop(hbInterval);

                        // 嗡鸣音量渐增
                        AudioSystem.setHumVolume(Math.min(0.08, 0.02 + (currentLine / script.length) * 0.06));
                    }

                    // 特殊停顿
                    if (currentLine === 19) { // "也没有你。"之后长停顿
                        lineDelay = 2000;
                    }
                    if (currentLine === 23) { // "..."之后长停顿
                        lineDelay = 3000;
                    }

                    typeTimer = setTimeout(typeNextLine, lineDelay);
                }
            }

            function render() {
                var fullText = tw.textContent;
                // 如果是新行，先保留之前的内容
                if (currentChar === 1) {
                    // 不需要额外操作，currentText已经有第一个字
                }

                // 重新构建显示文本
                var displayText = '';
                var savedLines = currentLine; // 当前正在打的行
                // 已完成的行
                for (var i = 0; i < currentLine; i++) {
                    displayText += script[i] + '\n';
                }
                // 当前正在打的行
                displayText += currentText;

                tw.textContent = displayText;

                // 自动滚动
                window.scrollTo(0, document.body.scrollHeight);
            }

            function onTypewriterComplete() {
                // 显示光标
                tw.innerHTML = tw.textContent + '<span class="cursor"></span>';

                // 最后心跳重击
                AudioSystem.playHeartbeat(0.8);
                setTimeout(function() { AudioSystem.playHeartbeat(0.8); }, 800);

                // 延迟显示输入框
                setTimeout(function() {
                    inputArea.style.display = 'block';
                    nameInput.focus();
                }, 2000);
            }

            // 输入名字
            nameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    var name = nameInput.value.trim();
                    if (name.length > 0) {
                        submitName(name);
                    }
                }
            });

            function submitName(name) {
                inputArea.style.display = 'none';
                recorded.style.display = 'block';

                // 记录名字（仅存本地）
                localStorage.setItem('guizhen_initiated_name', name);

                // 停止心跳
                AudioSystem.stopHeartbeatLoop();

                // 深沉的嗡鸣
                AudioSystem.setHumVolume(0.08);
                AudioSystem.playBurst();

                // 延迟后开始坍缩
                setTimeout(function() {
                    startCollapse();
                }, 1500);
            }

            function startCollapse() {
                document.body.classList.add('collapsing');

                // 加速的心跳
                AudioSystem.startHeartbeatLoop(300);

                // 3秒后白屏
                setTimeout(function() {
                    whiteScreen.classList.add('visible');
                    AudioSystem.stopHeartbeatLoop();

                    // 白屏时嗡鸣渐出
                    AudioSystem.setHumVolume(0);
                    setTimeout(function() {
                        AudioSystem.stopAll();
                    }, 2000);

                    // 重置状态
                    CorruptionSystem.corruption = 0;
                    CorruptionSystem.discoveredClues = [];
                    CorruptionSystem.truthUnlocked = false;
                    CorruptionSystem.initiated = true;
                    CorruptionSystem.save();

                    // 清除session进度
                    sessionStorage.removeItem('guizhen_initiation_progress');
                    sessionStorage.removeItem('guizhen_initiation_index');

                    // 5秒后跳回首页
                    setTimeout(function() {
                        window.location.href = '../index.html';
                    }, 5000);
                }, 3000);
            }

            // 防止用户在终局中离开（beforeunload警告）
            var warningShown = false;
            window.addEventListener('beforeunload', function(e) {
                if (typing || inputArea.style.display === 'block') {
                    if (!warningShown) {
                        warningShown = true;
                        e.preventDefault();
                        e.returnValue = '归真尚未完成。确定要离开吗？';
                        return e.returnValue;
                    }
                }
            });

            // 禁止右键和F12（象征性的）
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                    e.preventDefault();
                }
            });

            // 设置污染度为100（终局）
            localStorage.setItem('guizhen_corruption', '100');
        })();
    </script>

<!-- 你已经在了。 -->
</body>
</html>
