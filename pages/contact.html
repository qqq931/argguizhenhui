<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 归真会</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .contact-form {
            max-width: 500px;
            margin: 0 auto;
        }
        .contact-form label {
            display: block;
            margin-bottom: 5px;
            color: #6b3a1a;
            font-weight: bold;
        }
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 15px;
            border: 1px solid #c4a36a;
            background: #f5e6c8;
            font-family: inherit;
            font-size: 1em;
            border-radius: 3px;
        }
        .contact-form textarea {
            height: 120px;
            resize: vertical;
        }
        .contact-form button {
            background: linear-gradient(180deg, #ff9933, #cc6600);
            color: #fff;
            border: 2px outset #ffaa44;
            padding: 10px 30px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
            font-family: inherit;
        }
        .contact-form button:hover {
            background: linear-gradient(180deg, #ffaa44, #dd7711);
        }
        .contact-info {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: rgba(139,69,19,0.05);
            border-radius: 5px;
        }
        .contact-info p {
            text-indent: 0;
            margin-bottom: 8px;
        }
    </style>
</head>
<body class="page-contact">

    <a href="#" class="admin-link" aria-hidden="true">&nbsp;</a>

    <div class="container">
        <header class="site-header">
            <div class="lotus-logo" title="归真会">
                <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="50" cy="55" rx="8" ry="12" fill="#d4853a" opacity="0.8"/>
                    <ellipse cx="50" cy="38" rx="10" ry="20" fill="#e8a050" opacity="0.7" transform="rotate(0 50 50)"/>
                    <ellipse cx="50" cy="38" rx="10" ry="20" fill="#e8a050" opacity="0.7" transform="rotate(45 50 50)"/>
                    <ellipse cx="50" cy="38" rx="10" ry="20" fill="#e8a050" opacity="0.7" transform="rotate(90 50 50)"/>
                    <ellipse cx="50" cy="38" rx="10" ry="20" fill="#e8a050" opacity="0.7" transform="rotate(135 50 50)"/>
                    <ellipse cx="50" cy="30" rx="12" ry="25" fill="#f0b870" opacity="0.6" transform="rotate(22.5 50 50)"/>
                    <ellipse cx="50" cy="30" rx="12" ry="25" fill="#f0b870" opacity="0.6" transform="rotate(67.5 50 50)"/>
                    <ellipse cx="50" cy="30" rx="12" ry="25" fill="#f0b870" opacity="0.6" transform="rotate(112.5 50 50)"/>
                    <ellipse cx="50" cy="30" rx="12" ry="25" fill="#f0b870" opacity="0.6" transform="rotate(157.5 50 50)"/>
                </svg>
            </div>
            <div class="eye-logo">
                <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="50" cy="50" rx="40" ry="22" fill="none" stroke="#8b0000" stroke-width="2"/>
                    <circle cx="50" cy="50" r="12" fill="#8b0000"/>
                    <circle cx="50" cy="50" r="5" fill="#000"/>
                </svg>
            </div>
            <h1>联系我们</h1>
            <div class="subtitle">你不需要找我们。我们会找到你。</div>
        </header>

        <nav>
            <a href="../index.html">首页</a>
            <a href="testimony.html">会员见证</a>
            <a href="doctrine.html">教义问答</a>
            <a href="contact.html" class="active">联系我们</a>
        </nav>

        <div class="content">
            <h2>与我们对话</h2>
            <p>如果你感到内心有什么在呼唤——那就是了。填写下面的表格，或者直接来我们的中心。门永远开着。</p>

            <div class="contact-info">
                <p><strong>归真会 · 静心中心</strong></p>
                <p>地址：你心里那条一直没走的路的尽头</p>
                <p>邮箱：void@guizhen.example</p>
                <p>时间：每时每刻</p>
            </div>

            <div class="contact-form">
                <label for="c-name">你的名字：</label>
                <input type="text" id="c-name" placeholder="你以为的名字">

                <label for="c-email">联系方式：</label>
                <input type="email" id="c-email" placeholder="我们会找到你的">

                <label for="c-msg">你想说什么：</label>
                <textarea id="c-msg" placeholder="放下顾虑，写下来..."></textarea>

                <div style="text-align:center;">
                    <button type="button" onclick="submitForm()">提交</button>
                </div>
                <p id="form-result" style="text-indent:0; text-align:center; margin-top:15px; color:#2a6b2a; display:none;"></p>
            </div>
        </div>

        <footer class="site-footer">
            <p>归真会 &copy; 永恒元年 | 你不需要联系我们</p>
        </footer>
    </div>

    <script src="../js/audio.js"></script>
    <script src="../js/corruption.js"></script>
    <script>
        function submitForm() {
            var name = document.getElementById('c-name').value;
            var result = document.getElementById('form-result');

            if (!name.trim()) {
                result.textContent = '名字不重要。但还是填一下吧。';
                result.style.color = '#8b0000';
                result.style.display = 'block';
                return;
            }

            result.textContent = '已收到。我们一直在等你，' + name + '。';
            result.style.color = '#2a6b2a';
            result.style.display = 'block';

            // 提交表单也增加一点污染
            CorruptionSystem.addCorruption(3, 'contact');

            document.getElementById('c-name').disabled = true;
            document.getElementById('c-email').disabled = true;
            document.getElementById('c-msg').disabled = true;
        }
    </script>

</body>
</html>
